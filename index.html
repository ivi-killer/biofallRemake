<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="BioFall: un roguelike de supervivencia 2D.">
  <title>BioFall</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" class="app-shell">
    <canvas id="game-canvas" aria-label="Área de juego de BioFall"></canvas>
    <section class="boot-panel" aria-live="polite">
      <p class="eyebrow">BIOFALL PROJECT</p>
      <h1>BioFall</h1>
      <p class="boot-message" id="boot-message">Inicializando el motor...</p>
      <span class="engine-version" id="engine-version">ENGINE 0.1.0</span>
    </section>
    <p class="corner-note">SURVIVE · ADAPT · DESCEND</p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
